[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-fail2skip"
version = "1.0.0"
description = "A pytest plugin that reports failures of marked tests as skipped, so known failures don't block the run."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]

keywords = [
    "pytest",
    "plugin",
    "testing",
    "skip",
    "known-failures",
    "ci",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pytest>=9.2.0",
]

[dependency-groups]
dev = [
    "custom-python-logger>=4.1.0",
    "pre-commit>=4.7.0",
    "python-base-command",
    "python-dotenv>=1.2.4",
    "setuptools>=84.0.0",
    "wheel>=0.45.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/fail2skip"
Repository = "https://github.com/aviz92/fail2skip"
Issues = "https://github.com/aviz92/fail2skip/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_fail2skip*"]
namespaces = false

[project.entry-points.pytest11]
fail2skip = "pytest_fail2skip.plugin"
